@let k = knoop();
@let geo = geometrie();

<figure
  class="knoop-viewer"
  [class.is-dubbelstreng]="(k.strengen ?? 1) === 2"
  [class.patroon-dunne-strepen]="(k.patroon ?? 'dunne-strepen') === 'dunne-strepen'"
  [class.patroon-ruitjes]="k.patroon === 'ruitjes'"
  [class.patroon-gestipt]="k.patroon === 'gestipt'"
  [class.patroon-dubbele-stippen]="k.patroon === 'dubbele-stippen'"
  [style.--touw-kleur]="k.kleur || 'var(--kleur-accent)'"
  [style.--touw-kleur-2]="k.kleur2 || '#ffd96a'"
>
  <div class="knoop-viewer__top">
    <span class="knoop-viewer__tag">{{ k.tag }}</span>
  </div>

  <h3 class="knoop-viewer__naam">{{ k.naam }}</h3>
  <p class="knoop-viewer__ondertitel">{{ k.ondertitel }}</p>
  @if (k.beschrijving) {
    <p class="knoop-viewer__beschrijving">{{ k.beschrijving }}</p>
  }

  <div class="knoop-viewer__stage">
    <svg
      class="knoop-viewer__svg"
      [attr.viewBox]="'0 0 ' + k.vbW + ' ' + k.vbH"
      [style.--voortgang]="voortgang()"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      [attr.aria-label]="'Diagram van de ' + k.naam"
    >
      <defs>
        <!-- Onthult het touw langs zijn lengte (scrubber) -->
        <mask
          [attr.id]="maskerId"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          [attr.width]="k.vbW"
          [attr.height]="k.vbH"
        >
          <path class="knoop-viewer__reveal" pathLength="1" [attr.d]="geo.pad" />
        </mask>

      </defs>

      <!-- Alles binnen het reveal-masker, zodat ook de over-strengen netjes
           langs de touwlengte worden onthuld (niets steekt vooruit). -->
      <g [attr.mask]="'url(#' + maskerId + ')'">
        <!-- Hoofdtouw -->
        <g class="knoop-viewer__touw">
          @if ((k.strengen ?? 1) === 2) {
            <path class="knoop-viewer__omhulsel knoop-viewer__strenglijn knoop-viewer__strenglijn--a" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__omhulsel knoop-viewer__strenglijn knoop-viewer__strenglijn--b" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__streng knoop-viewer__strenglijn knoop-viewer__strenglijn--a" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__streng knoop-viewer__strenglijn knoop-viewer__strenglijn--b" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__vezel knoop-viewer__strenglijn knoop-viewer__strenglijn--a" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__vezel knoop-viewer__strenglijn knoop-viewer__strenglijn--b" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__glans knoop-viewer__strenglijn knoop-viewer__strenglijn--a" pathLength="1" [attr.d]="geo.pad" />
            <path class="knoop-viewer__glans knoop-viewer__strenglijn knoop-viewer__strenglijn--b" pathLength="1" [attr.d]="geo.pad" />
          } @else {
          <path class="knoop-viewer__omhulsel" pathLength="1" [attr.d]="geo.pad" />
          <path class="knoop-viewer__streng" pathLength="1" [attr.d]="geo.pad" />
          <path class="knoop-viewer__vezel" pathLength="1" [attr.d]="geo.pad" />
          <path class="knoop-viewer__glans" pathLength="1" [attr.d]="geo.pad" />
          }
        </g>

      </g>

      <!-- Labels bij de uiteinden -->
      @if (k.staandLabel) {
        <text
          class="knoop-viewer__eindlabel"
          [attr.x]="k.staandLabel.x"
          [attr.y]="k.staandLabel.y"
          text-anchor="end"
        >{{ k.staandLabel.tekst }}</text>
      }
      @if (k.tampLabel) {
        <text
          class="knoop-viewer__eindlabel"
          [attr.x]="k.tampLabel.x"
          [attr.y]="k.tampLabel.y"
          text-anchor="start"
        >{{ k.tampLabel.tekst }}</text>
      }
    </svg>
  </div>

  <!-- Bediening: afspelen + scrubber -->
  <div class="knoop-viewer__bediening">
    <button
      type="button"
      class="knoop-viewer__speel"
      (click)="speelAf()"
      [attr.aria-label]="speelt() ? 'Pauzeer' : 'Speel af'"
    >
      @if (speelt()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      }
    </button>

    <input
      class="knoop-viewer__scrubber"
      type="range"
      min="0"
      max="1"
      step="0.001"
      [value]="voortgang()"
      (input)="zetVoortgang($any($event.target).value)"
      aria-label="Sleep om de knoop te zien ontstaan"
    />
  </div>

  <!-- Stappen -->
  <ol class="knoop-viewer__stappen">
    @for (stap of k.stappen; track $index) {
      <li
        class="knoop-viewer__stap"
        [class.is-actief]="$index === actieveStap()"
      >
        <button type="button" class="knoop-viewer__stap-knop" (click)="naarStap($index)">
          <span class="knoop-viewer__stap-nr">{{ ($index + 1).toString().padStart(2, '0') }}</span>
          <span class="knoop-viewer__stap-tekst">
            <span class="knoop-viewer__stap-titel">{{ stap.titel }}</span>
            <span class="knoop-viewer__stap-uitleg">{{ stap.tekst }}</span>
          </span>
        </button>
      </li>
    }
  </ol>
</figure>
